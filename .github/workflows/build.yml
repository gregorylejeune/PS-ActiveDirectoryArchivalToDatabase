name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sign:
    name: Sign PowerShell
    needs: secret-scan
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS.Tools.SecretsManager
        shell: pwsh
        run: Install-Module AWS.Tools.SecretsManager -Scope CurrentUser -Force

      - name: Write PFX to runner temp
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64}}
        run: |
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX_B64)
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          "PFX written to $path"

      - name: Sign PowerShell files
        shell: pwsh
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD}}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1,*.ps1xml |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          $secure = ConvertTo-SecureString $env:CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = Get-PfxData -FilePath $pfx -Password $secure
          foreach ($f in $files) {
            $result = Set-AuthenticodeSignature -FilePath $f.FullName `
              -Certificate $cert.EndEntityCertificates[0] `
              -HashAlgorithm SHA256 `
              -TimestampServer 'http://timestamp.digicert.com'
            if ($result.Status -ne 'Valid') {
              throw "Signing failed for $($f.FullName): $($result.Status)"
            }
            "Signed $($f.FullName)"
          }

      - name: Remove PFX
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          if (Test-Path $path) { Remove-Item $path -Force }
